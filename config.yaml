bot_settings:
  # Modo visual (headless: false muestra la ventana del navegador)
  headless: false
  # Máximo de solicitudes a enviar por ejecución (recomendado: 15-30 para evitar bloqueos)
  max_applications_per_run: 25
  # Pausa mínima y máxima entre acciones en segundos (simula comportamiento humano)
  min_delay_sec: 2.5
  max_delay_sec: 5.0
  # Filtro de fecha en LinkedIn (r86400 = últimas 24 horas, r604800 = última semana)
  date_posted_filter: "r604800" # Última semana para mayor volumen de ofertas válidas
  # Base de datos local para no repetir postulaciones
  database_path: "data/applications.db"
